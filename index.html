<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            padding-top: 90px;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f8f9fa;
            border-bottom: 2px solid #eeeeee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00adb5;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #333333;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00adb5;
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            padding: 8px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }
        .search-bar button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .search-bar button:hover {
            background-color: #007c82;
        }

        /* Home */
        .home-section {
            height: calc(100vh - 90px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 80px;
            gap: 40px;
        }
        .home-content {
            flex: 1;
        }
        .home-section h1 {
            font-size: 3rem;
            color: #00adb5;
            margin-bottom: 15px;
        }
        .home-section p {
            font-size: 1.5rem;
            color: #555555;
            margin-bottom: 35px;
        }
        .scroll-btn {
            background-color: #00adb5;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .scroll-btn:hover {
            background-color: #007c82;
        }
        .home-image img {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00adb5;
        }

        /* About */
        .about-section {
            padding: 60px 20px;
            text-align: center;
            border-top: 2px solid #eeeeee;
        }
        .about-section h2 {
            font-size: 2.5rem;
            color: #00adb5;
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            background-color: #f8f9fa;
            padding: 40px 20px;
            border-top: 2px solid #00adb5;
            text-align: center;
        }
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .contact-form input, .contact-form textarea {
            padding: 15px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }
        .submit-btn {
            background-color: #00adb5;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #007c82;
        }

        /* Share buttons */
        .share-buttons {
            margin-top: 20px;
        }
        .share-buttons a {
            margin: 0 10px;
            text-decoration: none;
            color: #00adb5;
            font-weight: bold;
        }
        .share-buttons a:hover {
            color: #007c82;
        }

        /* Mobile */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
            }
            .home-section {
                flex-direction: column-reverse;
                text-align: center;
                padding: 40px 20px;
                height: auto;
            }
            .home-image img {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Portfolio</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <div class="search-bar">
            <input type="text" placeholder="Search..." id="searchInput">
            <button onclick="searchFunction()">Search</button>
        </div>
    </header>

    <!-- Home -->
    <section id="home" class="home-section">
        <div class="home-content">
            <h1>Hi, I am a Web Designer</h1>
            <p>I create beautiful and modern websites</p>
            <a href="#about" class="scroll-btn">Know More About Me</a>
        </div>
        <div class="home-image">
            <img src="my-profile.jpg" alt="My Profile Photo">
        </div>
    </section>

    <!-- About -->
    <section id="about" class="about-section">
        <h2>About Me</h2>
        <p>I love coding. My main goal is to create simple and very fast websites for users.</p>
    </section>

    <!-- Footer -->
    <footer id="contact">
        <div class="footer-container">
            <h3>Contact Me</h3>
            <form class="contact-form" action="mailto:dineshkumarm3210@gmail.com" method="post" enctype="text/plain">
                <input type="email" name="Email" placeholder="Your email address..." required>
                <textarea name="Message" rows="5" placeholder="Type your message here..." required></textarea>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <!-- Share Buttons -->
            <div class="share-buttons">
                <p>Share my portfolio:</p>
                <a href="https://www.facebook.com/sharer/sharer.php?u=https://yourportfolio.com" target="_blank">Facebook</a>
                <a href="https://twitter.com/intent/tweet?url=https://yourportfolio.com&text=Check+out+this+portfolio!" target="_blank">Twitter</a>
                <a href="https://www.linkedin.com/shareArticle?mini=true&url=https://yourportfolio.com" target="_blank">LinkedIn</a>
            </div>
        </div>
    </footer>

    <!-- JavaScript for Search -->
    <script>
        function searchFunction() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            if (input.includes("about")) {
                window.location.href = "#about";
            } else if (input.includes("home")) {
                window.location.href = "#home";
            } else if (input.includes("contact")) {
                window.location.href = "#contact";
            } else {
                alert("No results found!");
            }
        }
    </script>

</body>
</html>
