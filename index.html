<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --accent-color: #00adb5;
      --header-bg: #f8f9fa;
    }
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f1f1f1;
      --accent-color: #ff9800;
      --header-bg: #1e1e1e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-top: 90px;
      transition: background-color 0.5s, color 0.5s;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: var(--header-bg);
      border-bottom: 2px solid #eeeeee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 10px;
      transition: background-color 0.5s;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: var(--accent-color);
    }

    /* Dark Mode Toggle */
    .toggle-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Home */
    .home-section {
      height: calc(100vh - 90px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 80px;
      gap: 40px;
    }
    .home-content {
      flex: 1;
      animation: fadeInLeft 2s;
    }
    .home-section h1 {
      font-size: 3rem;
      color: var(--accent-color);
      margin-bottom: 15px;
    }
    .home-section p {
      font-size: 1.5rem;
      color: var(--text-color);
      margin-bottom: 35px;
    }
    .scroll-btn, .resume-btn {
      background-color: var(--accent-color);
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: 0.3s;
    }
    .scroll-btn:hover, .resume-btn:hover {
      background-color: #007c82;
    }
    .home-image img {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--accent-color);
      animation: fadeInRight 2s;
    }

    /* Animations */
    @keyframes fadeInLeft {
      from {opacity:0; transform: translateX(-50px);}
      to {opacity:1; transform: translateX(0);}
    }
    @keyframes fadeInRight {
      from {opacity:0; transform: translateX(50px);}
      to {opacity:1; transform: translateX(0);}
    }

    /* About */
    .about-section {
      padding: 60px 20px;
      text-align: center;
      border-top: 2px solid #eeeeee;
      animation: fadeInUp 2s;
    }
    .about-section h2 {
      font-size: 2.5rem;
      color: var(--accent-color);
      margin-bottom: 20px;
    }
    @keyframes fadeInUp {
      from {opacity:0; transform: translateY(50px);}
      to {opacity:1; transform: translateY(0);}
    }

    /* Footer */
    footer {
      background-color: var(--header-bg);
      padding: 40px 20px;
      border-top: 2px solid var(--accent-color);
      text-align: center;
      transition: background-color 0.5s;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 500px;
      margin: 0 auto;
    }
    .contact-form input, .contact-form textarea {
      padding: 15px;
      border: 1px solid #cccccc;
      border-radius: 5px;
    }
    .submit-btn {
      background-color: var(--accent-color);
      color: white;
      padding: 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #007c82;
    }

    /* Share buttons */
    .share-buttons {
      margin-top: 20px;
    }
    .share-buttons a {
      margin: 0 10px;
      text-decoration: none;
      color: var(--accent-color);
      font-weight: bold;
    }
    .share-buttons a:hover {
      color: #007c82;
    }

    /* Mobile */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
      }
      .home-section {
        flex-direction: column-reverse;
        text-align: center;
        padding: 40px 20px;
        height: auto;
      }
      .home-image img {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>

  </footer>
